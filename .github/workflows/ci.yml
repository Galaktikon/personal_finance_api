name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finance_test
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://finance:finance_ci_only@localhost:5432/finance_test
      TEST_DATABASE_URL: postgresql+psycopg://finance:finance_ci_only@localhost:5432/finance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install uv==0.13.6
      - name: Install locked dependencies
        run: python -m uv sync --locked --all-groups
      - name: Lint and format
        run: |
          python -m uv run ruff check .
          python -m uv run ruff format --check .
      - name: Type check
        run: python -m uv run mypy app
      - name: Migrate from empty database
        run: python -m uv run alembic upgrade head
      - name: Run tests
        run: python -m uv run pytest -q
